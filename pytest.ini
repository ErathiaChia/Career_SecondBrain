[pytest]
# One command for all three packages: `make test` (or `python -m pytest`).
testpaths = era_indexer/tests era_mcp/tests era_auditor/tests
norecursedirs = era_mcp/tests/integration local .venv node_modules
# prepend import mode (default): importlib mode registers a fake "era_mcp" parent
# module for era_mcp/tests and shadows the real package.
addopts = -q --timeout=120 -p no:cacheprovider
markers =
    db: needs a live Postgres (integration only)
    llm: needs a local Ollama (never run in CI)
