# Era Vault "read" side on the Synology NAS.
#
# Postgres and Ollama already run as separate NAS containers. This compose file
# only rebuilds/recreates the OpenWebUI-compatible MCP/API container and reaches
# those existing services through their published NAS ports.

services:
  mcp-server:
    container_name: era-vault-mcp
    build:
      context: ..
      dockerfile: era_mcp/Dockerfile
    restart: always
    env_file:
      - ../.env
    environment:
      ERA_VAULT_DB_HOST: ${NAS_HOST}
      ERA_VAULT_DB_PORT: "15432"
      ERA_VAULT_DB_NAME: era_vault
      ERA_VAULT_DB_USER: era
      OLLAMA_BASE_URL: http://${NAS_HOST}:11434
      # Must match the indexer's embedding model + the vector(1024) schema.
      # Pull it on the NAS Ollama first: `ollama pull qwen3-embedding:0.6b`.
      EMBEDDING_MODEL: qwen3-embedding:0.6b

      # ---- Agent layer (/ask): query rewrite + rerank + answer synthesis ----
      # The heavy LLM runs on the M1 Max (the 6 GB NAS Ollama can't host it).
      # Set MAC_HOST / NAS_HOST in ../.env (Tailscale names or LAN IPs). Keep the
      # Mac awake (caffeinate); when it's unreachable /ask returns 503.
      # Mac Tailscale IP (works at home and away). Requires Tailscale on the Mac,
      # Ollama listening on *:11434, and `tailscale configure-host` on the NAS
      # (boot-up task) so the NAS and its containers can route to 100.x.
      # LAN fallback: http://${MAC_LAN_HOST}:11434
      LLM_PRIMARY_BASE_URL: http://${MAC_HOST}:11434
      LLM_PRIMARY_KIND: ollama            # or "openai_compat" for mlx_lm.server
      # qwen3.5:35b is MoE (~3B active) -> fast on the M1 Max; one model serves
      # rewrite, rerank, Judge and synthesis so only one stays loaded.
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-qwen3.5:35b}
      # Judge defaults to the primary model (one model stays loaded).
      LLM_PRIMARY_TIMEOUT: "60"
      LLM_THINK: "0"
      # 32k so the agent's 20k-token evidence context + answer never overflow.
      LLM_NUM_CTX: "32768"
      LLM_KEEP_ALIVE: 24h
      QUERY_REWRITE_TIMEOUT: "30"
      # ---- Bounded agent budget (brief §2) ----
      AGENT_MAX_ITERS: "3"
      AGENT_MAX_TOOL_CALLS_PER_ITERATION: "3"
      AGENT_MAX_DOCUMENTS: "10"
      AGENT_MAX_CONTEXT_TOKENS: "20000"
      AGENT_TIME_BUDGET: "120"
      # ---- Local-first (organisation policy) ----
      # No cloud LLM: vault content never leaves the local network. If the Mac is
      # unreachable /ask returns 503 instead of silently calling OpenAI.
      CLOUD_LLM_OPTIN: "0"
      LLM_FALLBACK_ENABLED: "0"
      # Bearer token required on every endpoint when set (from ../.env).
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}

      # Reranker — Ollama has no rerank endpoint. Default is Infinity on the Mac
      # (era_mcp/tools/run_reranker.sh, kept alive by launchd). Fallback
      # "llm_score" reuses the Mac LLM in small batches (RERANK_MAX_CANDIDATES /
      # LLM_RERANK_BATCH) and is slower + noisier.
      RERANK_ENABLED: "1"
      RERANK_KIND: ${RERANK_KIND:-infinity}
      RERANK_BASE_URL: http://${MAC_HOST}:7997
      RERANK_TIMEOUT: "15"
      RERANK_MODEL: BAAI/bge-reranker-v2-m3
      RERANK_MAX_CANDIDATES: "40"

      QUERY_REWRITE_ENABLED: "1"
      HYDE_ENABLED: "0"
    ports:
      - "8808:8808"
